name: Publish container images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            context: .
            port: 8080
            health: /
          - service: auth-server
            context: auth-server-openauth
            port: 4001
            health: /health
          - service: tts-backend
            context: tts-backend
            port: 8001
            health: /health
    env:
      SERVICE: ${{ matrix.service }}
      CONTEXT: ${{ matrix.context }}
      PORT: ${{ matrix.port }}
      HEALTH_PATH: ${{ matrix.health }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image
        env:
          VITE_AUTH_SERVER_URL: ${{ vars.VITE_AUTH_SERVER_URL }}
          VITE_SPACETIME_WS_URL: ${{ vars.VITE_SPACETIME_WS_URL }}
          VITE_SPACETIME_DATABASE: ${{ vars.VITE_SPACETIME_DATABASE }}
          VITE_KOKORO_BASE_URL: ${{ vars.VITE_KOKORO_BASE_URL }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE"
          args=()
          if [[ "$SERVICE" == client ]]; then
            args=(--build-arg VITE_AUTH_SERVER_URL --build-arg VITE_SPACETIME_WS_URL
                  --build-arg VITE_SPACETIME_DATABASE --build-arg VITE_KOKORO_BASE_URL)
          fi
          docker build "${args[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" "$CONTEXT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Check container
        run: |
          container=$(docker run --detach --publish "127.0.0.1:$PORT:$PORT" "$IMAGE:$GITHUB_SHA")
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          response=$(curl --fail --silent --show-error --retry 45 --retry-delay 2 --retry-all-errors \
            --max-time 5 "http://127.0.0.1:$PORT$HEALTH_PATH")
          if [[ "$SERVICE" == tts-backend ]]; then
            jq -e '.pipeline_ready == true' <<< "$response"
          fi
      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
