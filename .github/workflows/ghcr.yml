name: Publish container images

on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'release' || inputs.release_sha != '' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            context: .
            port: 8080
            health: /
          - service: auth-server
            context: auth-server-openauth
            port: 4001
            health: /health
          - service: tts-backend
            context: tts-backend
            port: 8001
            health: /health
          - service: spacetimedb-publisher
            context: .
            dockerfile: deploy/spacetimedb/Dockerfile
    env:
      SERVICE: ${{ matrix.service }}
      CONTEXT: ${{ matrix.context }}
      DOCKERFILE: ${{ matrix.dockerfile || 'Dockerfile' }}
      PORT: ${{ matrix.port }}
      HEALTH_PATH: ${{ matrix.health }}
      IMAGE_REVISION: ${{ inputs.release_sha || github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.IMAGE_REVISION }}
          persist-credentials: false
      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE"
          docker build --file "$CONTEXT/$DOCKERFILE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$IMAGE_REVISION" \
            --tag "$image:$IMAGE_REVISION" "$CONTEXT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Check container
        if: matrix.service != 'spacetimedb-publisher'
        run: |
          args=()
          if [[ "$SERVICE" == client ]]; then
            args=(--env VITE_AUTH_SERVER_URL=https://runtime.example.invalid)
          fi
          container=$(docker run --detach --publish "127.0.0.1:$PORT:$PORT" "${args[@]}" "$IMAGE:$IMAGE_REVISION")
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          response=$(curl --fail --silent --show-error --retry 45 --retry-delay 2 --retry-all-errors \
            --max-time 5 "http://127.0.0.1:$PORT$HEALTH_PATH")
          if [[ "$SERVICE" == client ]]; then
            grep -F 'src="/runtime-config.js"' <<< "$response"
            curl --fail --silent --show-error "http://127.0.0.1:$PORT/runtime-config.js" |
              grep -F '"VITE_AUTH_SERVER_URL":"https://runtime.example.invalid"'
          elif [[ "$SERVICE" == tts-backend ]]; then
            jq -e '.pipeline_ready == true' <<< "$response"
          fi
      - name: Check module publishing
        if: matrix.service == 'spacetimedb-publisher'
        run: |
          docker network create module-check
          trap 'docker logs module-check-db; docker rm --force module-check-db; docker network rm module-check' EXIT
          docker run --detach --name module-check-db --network module-check --publish 127.0.0.1::3000 \
            clockworklabs/spacetime:v2.0.1 start --listen-addr=0.0.0.0:3000
          address=$(docker port module-check-db 3000/tcp)
          url="http://$address"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --max-time 5 "$url/v1/ping"
          SPACETIMEDB_PUBLISH_TOKEN=$(curl --fail --silent --show-error --request POST \
            "$url/v1/identity" | jq -er '.token | select(type == "string" and length > 0)')
          echo "::add-mask::$SPACETIMEDB_PUBLISH_TOKEN"
          export SPACETIMEDB_PUBLISH_TOKEN
          publish_module() {
            docker run --rm --network module-check --env SPACETIMEDB_PUBLISH_TOKEN \
              --env SPACETIMEDB_SERVER_URL=http://module-check-db:3000 "$IMAGE:$IMAGE_REVISION"
          }
          publish_module
          identity=$(curl --fail --silent --show-error "$url/v1/database/pawlands/identity")
          publish_module
          test "$(curl --fail --silent --show-error "$url/v1/database/pawlands/identity")" = "$identity"
      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=("$IMAGE_REVISION")
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$RELEASE_TAG" == latest ]]; then
              echo "::error::Release tag is not suitable as an image version"
              exit 1
            fi
            tags+=("$RELEASE_TAG")
          fi
          if [[ "$PRERELEASE" != true ]]; then
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            if [[ "$tag" != "$IMAGE_REVISION" ]]; then
              docker tag "$IMAGE:$IMAGE_REVISION" "$IMAGE:$tag"
            fi
            docker push --platform linux/amd64 "$IMAGE:$tag"
            docker buildx imagetools inspect "$IMAGE:$tag"
          done
