[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["client/**", "public/**", "scripts/**", "shared/**", "*.json", "*.ts", "*.js", "index.html", "Dockerfile", "Dockerfile.dockerignore", "nginx.conf", "railway-client.toml"]

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300
